name: Playcurio
description: >-
  PlayCurio is a Seoul-based educational technology company that builds AR (augmented reality)
  play-learning products for children, pairing physical educational tools with digital content.
  Its catalog includes AR titles such as Curio Safari, Phonics Pop, Dictionary Pop, and Math Mates,
  alongside a content-IP business spanning characters like Detective Pete, Dino Tales, and 100+ Curio
  Safari animals, plus B2B production services (character development, 2D/3D animation, UI/UX, and
  live-action video). PlayCurio is consumer- and partnership-facing and publishes no developer API,
  developer portal, SDKs, or API documentation. Surfaced via the 500 Global portfolio and enriched
  here; a domain-security probe of play-curio.com is the only technical artifact this pass produced.
